[Explosions]
; true: allow an explosive attached directly to a vehicle to destroy it.
; Includes trailers, rovers, shuttles, VTOLs and rail vehicles.
; Nearby vehicles, cargo-mounted explosives and base equipment stay protected.
; false: protect vehicles too.
; Console: babyproof vehicles on/off/status (or babyproof v on/off/status).
AllowAttachedVehicleDestruction=false
